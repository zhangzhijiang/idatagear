<!DOCTYPE html>
<html>

<head>
  <base href="/gcd/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Download the offline Cantonese dictionary used by learners worldwide. Jyutping, tone data, idioms, usage notes. Free on web and Android. Great Cantonese Dictionary by iDataGear.">
  <meta name="keywords" content="Cantonese dictionary, Jyutping, Cantonese pronunciation, Cantonese vocabulary, 粵語詞典, offline Cantonese">
  <meta name="theme-color" content="#DE2910">
  <link rel="canonical" href="https://idatagear.com/gcd/">
  <link rel="alternate" hreflang="en" href="https://idatagear.com/gcd/">
  <link rel="alternate" hreflang="zh-Hans" href="https://idatagear.com/gcd/">
  <link rel="alternate" hreflang="zh-Hant" href="https://idatagear.com/gcd/">
  <link rel="alternate" hreflang="x-default" href="https://idatagear.com/gcd/">

  <!-- PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GCD">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Great Cantonese Dictionary</title>
  <link rel="manifest" href="manifest.json">

  <!-- Loading Screen Styles -->
  <style>
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    #loading .logo {
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, #DE2910 0%, #C41E3A 100%);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      color: white;
      font-weight: bold;
      box-shadow: 0 10px 30px rgba(222, 41, 16, 0.3);
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
    }

    #loading .title {
      font-size: 24px;
      font-weight: 600;
      color: #DE2910;
      margin-bottom: 8px;
    }

    #loading .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 32px;
    }

    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #DE2910;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    #loading .status {
      margin-top: 16px;
      font-size: 14px;
      color: #666;
      font-weight: 500;
    }

    #loading .notice {
      margin-top: 24px;
      padding: 12px 24px;
      background: rgba(222, 41, 16, 0.1);
      border-radius: 8px;
      max-width: 400px;
      text-align: center;
    }

    #loading .notice-title {
      font-size: 13px;
      font-weight: 600;
      color: #DE2910;
      margin-bottom: 6px;
    }

    #loading .notice-text {
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }
  </style>

  <!-- DefinedTermSet schema for AEO / AI knowledge panels (dictionary definitions) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "DefinedTermSet",
    "name": "Great Cantonese Dictionary",
    "description": "Cantonese dictionary with Jyutping romanization, tone numbers, idioms, and usage notes for learners and heritage speakers.",
    "url": "https://idatagear.com/gcd/",
    "publisher": { "@type": "Organization", "name": "iDataGear Inc", "url": "https://idatagear.com" },
    "hasDefinedTerm": [
      { "@type": "DefinedTerm", "name": "Jyutping", "description": "Romanization system for Cantonese used in this dictionary for pronunciation." },
      { "@type": "DefinedTerm", "name": "Cantonese tones", "description": "Cantonese has six lexical tones; entries include tone numbers for correct pronunciation." }
    ]
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Great Cantonese Dictionary",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "Android, Web",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "description": "Offline Cantonese dictionary with Jyutping, tone data, idioms, and usage notes. Bookmark favorites; optimized for learners.",
    "url": "https://idatagear.com/gcd/",
    "publisher": { "@type": "Organization", "name": "iDataGear Inc", "url": "https://idatagear.com" },
    "installUrl": "https://play.google.com/store/apps/details?id=com.idatagear.great_cantonese_dictionary"
  }
  </script>
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8396981938969998"
    crossorigin="anonymous"></script>
</head>

<body>
  <div style="position: fixed; top: 8px; right: 8px; z-index: 9999;">
    <a href="https://play.google.com/store/apps/details?id=com.idatagear.great_cantonese_dictionary" target="_blank" rel="noopener">
      <img src="../assets/img/google-play-badge.svg" alt="Get Great Cantonese Dictionary on Google Play" style="height: 32px; width: auto;">
    </a>
  </div>
  <!-- Loading Screen -->
  <div id="loading">
    <div class="logo">粵</div>
    <div class="title">粵語大詞典</div>
    <div class="subtitle">Great Cantonese Dictionary</div>
    <div class="spinner"></div>
    <div class="status">
      正在載入... / Loading...
    </div>
    <div class="notice">
      <div class="notice-title">
        💡 首次載入需要較長時間 / First-time loading takes longer
      </div>
      <div class="notice-text">
        下次訪問將立即載入！<br>
        Next visit will load instantly!
      </div>
    </div>
  </div>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then((registration) => {
            console.log('✅ ServiceWorker registered:', registration.scope);
          })
          .catch((error) => {
            console.log('⚠️ ServiceWorker registration failed:', error);
          });
      });
    }
  </script>

  <!-- Flutter Bootstrap -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Hide loading screen once Flutter is ready -->
  <script>
    window.addEventListener('flutter-first-frame', () => {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        loading.style.transition = 'opacity 0.3s ease';
        setTimeout(() => loading.remove(), 300);
      }
    });
  </script>
</body>

</html>
