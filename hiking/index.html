<!DOCTYPE html>
<html>
<head>

    href value below to reflect the base path you are serving from.

    For more details:

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Momera.Hiking by iDataGear — free offline-first GPS hike tracker. Record routes with background GPS, use offline OpenStreetMap maps, drop geo-tagged photo, video and voice waypoints, and export animated track replays. Web and Android.">
  <meta name="keywords" content="Momera.Hiking, GPS hike tracker, offline hiking maps, hike route recorder, trail tracker app, offline GPS tracking, hiking waypoints, iDataGear">
  <link rel="canonical" href="https://www.idatagear.com/hiking/">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Momera.Hiking">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Momera.Hiking — Offline GPS Hike Tracker by iDataGear</title>

  <!-- Structured Data for Web Application -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Momera.Hiking",
    "applicationCategory": "TravelApplication",
    "operatingSystem": "Web, Android",
    "url": "https://www.idatagear.com/hiking/",
    "image": "https://www.idatagear.com/assets/img/momera-hiking-app-icon.png",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "description": "Offline-first GPS hike tracker: route recording and replay export, geo-tagged photo, video, and voice waypoints, offline OpenStreetMap maps, and a hike calendar with history.",
    "publisher": {
      "@type": "Organization",
      "name": "iDataGear Inc",
      "url": "https://www.idatagear.com"
    }
  }
  </script>
  <link rel="manifest" href="manifest.json">
</head>
