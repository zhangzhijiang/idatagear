<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HanziWriter Practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        #character-target-div {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        button {
            padding: 10px 20px;
            background-color: #1976D2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        button:active {
            background-color: #1565C0;
        }
        .status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
            display: none;
        }
    </style>
</head>
<body>
    <div class="status" id="status-message"></div>
    <div id="character-target-div"></div>

    <script>
        let writer = null;
        let currentCharacter = '';
        let hanziWriterLoaded = false;
        let pendingInit = null;

        // Load HanziWriter script - check if already injected, otherwise try CDN
        function loadHanziWriter() {
            if (typeof HanziWriter !== 'undefined') {
                handleScriptLoad();
                return;
            }

            showStatus('Loading HanziWriter...');
            
            // If JS was injected directly, it should be available immediately
            // Check multiple times with increasing delays to account for script evaluation
            let checkCount = 0;
            const maxChecks = 10;
            
            function checkForInjectedScript() {
                if (typeof HanziWriter !== 'undefined') {
                    handleScriptLoad();
                    return;
                }
                checkCount++;
                if (checkCount < maxChecks) {
                    setTimeout(checkForInjectedScript, 200);
                } else {
                    // If not injected after checking, try loading from CDN as fallback
                    tryLoadFromCDN();
                }
            }
            
            // Start checking after a short delay
            setTimeout(checkForInjectedScript, 100);
        }
        
        function tryLoadFromCDN() {
            // Try loading from CDN as fallback
            const cdnUrls = [
                'https://unpkg.com/hanzi-writer@4/dist/hanzi-writer.min.js',
                'https://cdn.jsdelivr.net/npm/hanzi-writer@4/dist/hanzi-writer.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/hanzi-writer/4.0.0/hanzi-writer.min.js',
                'https://unpkg.com/hanzi-writer@latest/dist/hanzi-writer.min.js'
            ];
                
                let currentIndex = 0;
                
                function tryLoadScript(index) {
                    if (index >= cdnUrls.length) {
                        handleScriptError();
                        return;
                    }
                    
                    const script = document.createElement('script');
                    script.src = cdnUrls[index];
                    script.async = true;
                    script.crossOrigin = 'anonymous';
                    script.onload = function() {
                        // Wait a bit to ensure HanziWriter is defined
                        setTimeout(function() {
                            if (typeof HanziWriter !== 'undefined') {
                                handleScriptLoad();
                            } else {
                                // Try next CDN
                                tryLoadScript(index + 1);
                            }
                        }, 100);
                    };
                    script.onerror = function() {
                        console.log('Failed to load from CDN ' + (index + 1) + ', trying next...');
                        // Try next CDN
                        tryLoadScript(index + 1);
                    };
                    document.head.appendChild(script);
                }
                
                tryLoadScript(0);
        }

        // Handle script load
        function handleScriptLoad() {
            if (typeof HanziWriter === 'undefined') {
                // Wait a bit more and check again
                setTimeout(function() {
                    if (typeof HanziWriter !== 'undefined') {
                        hanziWriterLoaded = true;
                        showStatus('HanziWriter loaded');
                        // Auto-initialize if character is set
                        if (window.autoInitCharacter) {
                            initHanziWriter(window.autoInitCharacter);
                        } else if (pendingInit) {
                            if (typeof pendingInit === 'object' && pendingInit.character) {
                                initHanziWriter(pendingInit.character, pendingInit.width, pendingInit.height);
                            } else {
                                initHanziWriter(pendingInit);
                            }
                            pendingInit = null;
                        }
                    } else {
                        handleScriptError();
                    }
                }, 500);
                return;
            }
            hanziWriterLoaded = true;
            showStatus('HanziWriter loaded');
            // Auto-initialize if character is set
            if (window.autoInitCharacter) {
                initHanziWriter(window.autoInitCharacter);
            } else if (pendingInit) {
                if (typeof pendingInit === 'object' && pendingInit.character) {
                    initHanziWriter(pendingInit.character, pendingInit.width, pendingInit.height);
                } else {
                    initHanziWriter(pendingInit);
                }
                pendingInit = null;
            }
        }

        // Handle script error
        function handleScriptError() {
            showStatus('Error loading HanziWriter. Check internet connection.');
            console.error('Failed to load HanziWriter from all CDN sources');
            
            // Check if we're online
            if (!navigator.onLine) {
                showStatus('No internet connection detected');
            }
            
            // Notify Flutter about the error
            if (window.FlutterChannel) {
                FlutterChannel.postMessage(JSON.stringify({
                    type: 'error',
                    message: 'Failed to load HanziWriter library from CDN. Please check your internet connection and try again. The app needs internet access to load the stroke order library.'
                }));
            }
        }

        // Start loading HanziWriter when page loads
        window.addEventListener('DOMContentLoaded', function() {
            loadHanziWriter();
        });

        // Also try loading immediately (in case DOMContentLoaded already fired)
        if (document.readyState === 'loading') {
            // DOM hasn't finished loading yet
        } else {
            // DOM is already loaded
            loadHanziWriter();
        }

        // Check if HanziWriter is available
        function checkHanziWriter() {
            if (typeof HanziWriter === 'undefined') {
                return false;
            }
            return true;
        }

        // Initialize HanziWriter with a character
        function initHanziWriter(character, width, height) {
            console.log('initHanziWriter called with character:', character, 'width:', width, 'height:', height);
            
            // Check if HanziWriter is loaded
            if (!checkHanziWriter()) {
                console.log('HanziWriter not loaded yet, setting pending init');
                showStatus('Loading HanziWriter...');
                pendingInit = { character: character, width: width, height: height };
                return;
            }

            currentCharacter = character;
            const targetDiv = document.getElementById('character-target-div');
            
            if (!targetDiv) {
                console.error('Target div not found!');
                showStatus('Error: Target div not found');
                return;
            }
            
            console.log('Target div found, creating HanziWriter instance');
            
            // Clear previous writer if exists
            if (writer) {
                try {
                    writer.hideCharacter();
                    writer = null;
                } catch (e) {
                    console.error('Error clearing previous writer:', e);
                }
            }
            
            // Clear the target div content
            targetDiv.innerHTML = '';
            
            // Calculate size - use provided size or larger default
            const charWidth = width || Math.min(window.innerWidth - 40, 600);
            const charHeight = height || Math.min(window.innerHeight - 200, 600);
            
            try {
                // Create new writer instance
                console.log('Creating HanziWriter with character:', character, 'size:', charWidth, 'x', charHeight);
                writer = HanziWriter.create('character-target-div', character, {
                width: charWidth,
                height: charHeight,
                padding: 20,
                showOutline: true,
                strokeColor: '#1976D2',
                strokeWidth: 2,
                radicalColor: '#FF6B6B',
                charDataLoader: function(char, onComplete) {
                    // Try to load from local assets first, fallback to CDN
                    // For now, use CDN - you can implement local loading later
                    fetch(`https://cdn.jsdelivr.net/npm/hanzi-writer-data@latest/${char}.json`)
                        .then(response => response.json())
                        .then(data => onComplete(data))
                        .catch(error => {
                            console.error('Error loading character data:', error);
                            // Fallback: try alternative CDN or show error
                            onComplete(null);
                        });
                },
                onComplete: function() {
                    showStatus('Character completed!');
                    // Notify Flutter
                    if (window.FlutterChannel) {
                        FlutterChannel.postMessage(JSON.stringify({
                            type: 'complete',
                            character: currentCharacter
                        }));
                    }
                },
                onCorrectStroke: function(strokeNum) {
                    showStatus('Correct stroke ' + strokeNum);
                    // Notify Flutter
                    if (window.FlutterChannel) {
                        FlutterChannel.postMessage(JSON.stringify({
                            type: 'correctStroke',
                            strokeNum: strokeNum,
                            character: currentCharacter
                        }));
                    }
                },
                onMistake: function(strokeData) {
                    showStatus('Try again!');
                    // Notify Flutter
                    if (window.FlutterChannel) {
                        FlutterChannel.postMessage(JSON.stringify({
                            type: 'mistake',
                            character: currentCharacter
                        }));
                    }
                }
                });
                
                console.log('HanziWriter created successfully');
                showStatus('Character loaded: ' + character);
            } catch (error) {
                console.error('Error creating HanziWriter:', error);
                console.error('Error stack:', error.stack);
                showStatus('Error: ' + (error.message || 'Unknown error'));
                if (window.FlutterChannel) {
                    FlutterChannel.postMessage(JSON.stringify({
                        type: 'error',
                        message: 'Failed to create HanziWriter: ' + (error.message || 'Unknown error')
                    }));
                }
            }
        }

        // Animate the character
        function animateCharacter() {
            if (!checkHanziWriter()) {
                showStatus('HanziWriter not loaded yet');
                return;
            }
            if (writer) {
                try {
                    writer.animateCharacter({
                        onComplete: function() {
                            showStatus('Animation complete!');
                        }
                    });
                } catch (error) {
                    console.error('Error animating character:', error);
                    showStatus('Error: ' + error.message);
                }
            } else {
                showStatus('Please initialize a character first');
            }
        }

        // Start quiz mode
        function startQuiz() {
            if (!checkHanziWriter()) {
                showStatus('HanziWriter not loaded yet');
                return;
            }
            if (writer) {
                try {
                    writer.quiz({
                        onComplete: function() {
                            showStatus('Quiz complete!');
                            if (window.FlutterChannel) {
                                FlutterChannel.postMessage(JSON.stringify({
                                    type: 'quizComplete',
                                    character: currentCharacter
                                }));
                            }
                        }
                    });
                } catch (error) {
                    console.error('Error starting quiz:', error);
                    showStatus('Error: ' + error.message);
                }
            } else {
                showStatus('Please initialize a character first');
            }
        }

        // Reset the character
        function resetCharacter() {
            if (!checkHanziWriter()) {
                showStatus('HanziWriter not loaded yet');
                return;
            }
            if (writer) {
                try {
                    writer.hideCharacter();
                    showStatus('Character reset');
                } catch (error) {
                    console.error('Error resetting character:', error);
                    showStatus('Error: ' + error.message);
                }
            } else {
                showStatus('Please initialize a character first');
            }
        }

        // Clear character display
        function clearCharacter() {
            const targetDiv = document.getElementById('character-target-div');
            if (targetDiv) {
                targetDiv.innerHTML = '';
            }
            if (writer) {
                try {
                    writer.hideCharacter();
                    writer = null;
                } catch (error) {
                    console.error('Error clearing character:', error);
                }
            }
            currentCharacter = null;
        }

        // Show status message
        function showStatus(message) {
            const statusEl = document.getElementById('status-message');
            statusEl.textContent = message;
            statusEl.style.display = 'block';
            setTimeout(() => {
                statusEl.style.display = 'none';
            }, 2000);
        }

        // Listen for messages from Flutter (for web iframe)
        window.addEventListener('message', function(event) {
            // Accept messages from any origin (since we control both)
            const data = event.data;
            if (data && typeof data === 'object') {
                switch (data.type) {
                    case 'initHanziWriter':
                        if (data.character) {
                            initHanziWriter(data.character, data.width, data.height);
                        }
                        break;
                    case 'animateCharacter':
                        animateCharacter();
                        break;
                    case 'startQuiz':
                        startQuiz();
                        break;
                    case 'resetCharacter':
                        resetCharacter();
                        break;
                    case 'clearCharacter':
                        clearCharacter();
                        break;
                }
            }
        });

        // Listen for messages from Flutter WebView
        window.addEventListener('flutter_inappwebview_platform_ready', function(event) {
            console.log('Flutter WebView ready');
        });
    </script>
</body>
</html>
