<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/learnchinese/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A comprehensive Chinese learning app with HSK levels, pronunciation, and interactive features.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="learn_chinese">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Learn Chinese Plus</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Error handler to catch initialization errors
    window.addEventListener('error', function(e) {
      console.error('Global error:', e.error);
      document.body.innerHTML = '<div style="padding: 20px; font-family: Arial; text-align: center;"><h1>Loading Error</h1><p>Please check the browser console for details.</p><p>Error: ' + (e.error ? e.error.toString() : 'Unknown error') + '</p></div>';
    });
    
    window.addEventListener('unhandledrejection', function(e) {
      console.error('Unhandled promise rejection:', e.reason);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
