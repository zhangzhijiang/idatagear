<body>
  <div id="android-promo" style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(15, 23, 42, 0.55); z-index: 9999; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">

    </div>
  </div>
  <script>
    (function () {
      var promo = document.getElementById('android-promo');
      var closeBtn = document.getElementById('android-promo-close');
      if (!promo || !closeBtn) return;

      function hidePromo() {
        if (!promo) return;
        promo.style.opacity = '0';
        promo.style.transition = 'opacity 0.25s ease';
        setTimeout(function () {
          if (promo && promo.parentNode) {
            promo.parentNode.removeChild(promo);
          }
        }, 250);
      }

      closeBtn.addEventListener('click', hidePromo);
      setTimeout(hidePromo, 3000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
