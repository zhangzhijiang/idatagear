  <!-- Structured Data for Web Application -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "ALL English",

<body>
  <div id="android-promo" style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(15, 23, 42, 0.55); z-index: 9999; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
    <div style="background: #ffffff; border-radius: 16px; padding: 1.25rem 1.5rem; max-width: 360px; width: 90%; box-shadow: 0 18px 45px rgba(15, 23, 42, 0.35); text-align: left; font-size: 0.95rem; color: #111827;">
      <p style="margin: 0 0 0.75rem;"><strong>Tip:</strong> ALL English works best as an Android app from Google Play.</p>
      <a href="https://play.google.com/store/apps/details?id=com.idatagear.learn_english" target="_blank" rel="noopener" style="display: inline-block; margin-bottom: 0.75rem;">
        <img src="../assets/img/google-play-badge.svg" alt="Get ALL English on Google Play" style="height: 40px; width: auto;">
      </a>
      <div style="text-align: right;">
        <button id="android-promo-close" type="button" style="border-radius: 999px; border: 1px solid #d1d5db; background: #f9fafb; padding: 0.25rem 0.9rem; font-size: 0.85rem; cursor: pointer;">OK</button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var promo = document.getElementById('android-promo');
      var closeBtn = document.getElementById('android-promo-close');
      if (!promo || !closeBtn) return;

      function hidePromo() {
        if (!promo) return;
        promo.style.opacity = '0';
        promo.style.transition = 'opacity 0.25s ease';
        setTimeout(function () {
          if (promo && promo.parentNode) {
            promo.parentNode.removeChild(promo);
          }
        }, 250);
      }

      closeBtn.addEventListener('click', hidePromo);
      setTimeout(hidePromo, 3000);
    })();
  </script>
  <script>
    // Error handler to catch initialization errors
    window.addEventListener('error', function(e) {
      console.error('Global error:', e.error);
      // Only show error UI if app hasn't loaded (checking flutter root element usually, but here just simple)
      // document.body.innerHTML = ... // Optional: enable this if needed
    });
    
    window.addEventListener('unhandledrejection', function(e) {
      console.error('Unhandled promise rejection:', e.reason);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
