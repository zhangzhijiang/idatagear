<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HanziWriter Practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        #character-target-div {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        button {
            padding: 10px 20px;
            background-color: #1976D2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        button:active {
            background-color: #1565C0;
        }
        .status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
            display: none;
        }
    </style>
</head>
<body>
    <div class="status" id="status-message"></div>
    <div id="character-target-div"></div>

    <script>
        let writer = null;
        let currentCharacter = '';
        let hanziWriterLoaded = false;
        let pendingInit = null;

        // Load HanziWriter script - check if already injected, otherwise try CDN
        function loadHanziWriter() {
            if (typeof HanziWriter !== 'undefined') {
                handleScriptLoad();
                return;
            }

            showStatus('Loading HanziWriter...');
            
            // If JS was injected directly, it should be available immediately
            // Wait a moment to check
            setTimeout(function() {
                if (typeof HanziWriter !== 'undefined') {
                    handleScriptLoad();
                    return;
                }
                
                // If not injected, try loading from CDN as fallback
                const cdnUrls = [
                    'https://unpkg.com/hanzi-writer@4.0/dist/hanzi-writer.min.js',
                    'https://cdn.jsdelivr.net/npm/hanzi-writer@4.0/dist/hanzi-writer.min.js',
                    'https://cdnjs.cloudflare.com/ajax/libs/hanzi-writer/4.0/hanzi-writer.min.js'
                ];
                
                let currentIndex = 0;
                
                function tryLoadScript(index) {
                    if (index >= cdnUrls.length) {
                        handleScriptError();
                        return;
                    }
                    
                    const script = document.createElement('script');
                    script.src = cdnUrls[index];
                    script.async = true;
                    script.crossOrigin = 'anonymous';
                    script.onload = function() {
                        // Wait a bit to ensure HanziWriter is defined
                        setTimeout(function() {
                            if (typeof HanziWriter !== 'undefined') {
                                handleScriptLoad();
                            } else {
                                // Try next CDN
                                tryLoadScript(index + 1);
                            }
                        }, 100);
                    };
                    script.onerror = function() {
                        console.log('Failed to load from CDN ' + (index + 1) + ', trying next...');
                        // Try next CDN
                        tryLoadScript(index + 1);
                    };
                    document.head.appendChild(script);
                }
                
                tryLoadScript(0);
            }, 100);
        }

        // Handle script load
        function handleScriptLoad() {
            if (typeof HanziWriter === 'undefined') {
                // Wait a bit more and check again
                setTimeout(function() {
                    if (typeof HanziWriter !== 'undefined') {
                        hanziWriterLoaded = true;
                        showStatus('HanziWriter loaded');
                        // If there's a pending initialization, run it now
                        if (pendingInit) {
                            initHanziWriter(pendingInit);
                            pendingInit = null;
                        }
                    } else {
                        handleScriptError();
                    }
                }, 500);
                return;
            }
            hanziWriterLoaded = true;
            showStatus('HanziWriter loaded');
            // If there's a pending initialization, run it now
            if (pendingInit) {
                initHanziWriter(pendingInit);
                pendingInit = null;
            }
        }

        // Handle script error
        function handleScriptError() {
            showStatus('Error loading HanziWriter. Check internet connection.');
            console.error('Failed to load HanziWriter from all CDN sources');
            
            // Check if we're online
            if (!navigator.onLine) {
                showStatus('No internet connection detected');
            }
            
            // Notify Flutter about the error
            if (window.FlutterChannel) {
                FlutterChannel.postMessage(JSON.stringify({
                    type: 'error',
                    message: 'Failed to load HanziWriter library from CDN. Please check your internet connection and try again. The app needs internet access to load the stroke order library.'
                }));
            }
        }

        // Start loading HanziWriter when page loads
        window.addEventListener('DOMContentLoaded', function() {
            loadHanziWriter();
        });

        // Also try loading immediately (in case DOMContentLoaded already fired)
        if (document.readyState === 'loading') {
            // DOM hasn't finished loading yet
        } else {
            // DOM is already loaded
            loadHanziWriter();
        }

        // Check if HanziWriter is available
        function checkHanziWriter() {
            if (typeof HanziWriter === 'undefined') {
                return false;
            }
            return true;
        }

        // Initialize HanziWriter with a character
        function initHanziWriter(character) {
            // Check if HanziWriter is loaded
            if (!checkHanziWriter()) {
                showStatus('Loading HanziWriter...');
                pendingInit = character;
                return;
            }

            currentCharacter = character;
            const targetDiv = document.getElementById('character-target-div');
            
            // Clear previous writer if exists
            if (writer) {
                writer = null;
            }
            
            try {
                // Create new writer instance
                writer = HanziWriter.create('character-target-div', character, {
                width: Math.min(window.innerWidth - 40, 400),
                height: Math.min(window.innerHeight - 200, 400),
                padding: 20,
                showOutline: true,
                strokeColor: '#1976D2',
                strokeWidth: 2,
                radicalColor: '#FF6B6B',
                charDataLoader: function(char, onComplete) {
                    // Try to load from local assets first, fallback to CDN
                    // For now, use CDN - you can implement local loading later
                    fetch(`https://cdn.jsdelivr.net/npm/hanzi-writer-data@latest/${char}.json`)
                        .then(response => response.json())
                        .then(data => onComplete(data))
                        .catch(error => {
                            console.error('Error loading character data:', error);
                            // Fallback: try alternative CDN or show error
                            onComplete(null);
                        });
                },
                onComplete: function() {
                    showStatus('Character completed!');
                    // Notify Flutter
                    if (window.FlutterChannel) {
                        FlutterChannel.postMessage(JSON.stringify({
                            type: 'complete',
                            character: currentCharacter
                        }));
                    }
                },
                onCorrectStroke: function(strokeNum) {
                    showStatus('Correct stroke ' + strokeNum);
                    // Notify Flutter
                    if (window.FlutterChannel) {
                        FlutterChannel.postMessage(JSON.stringify({
                            type: 'correctStroke',
                            strokeNum: strokeNum,
                            character: currentCharacter
                        }));
                    }
                },
                onMistake: function(strokeData) {
                    showStatus('Try again!');
                    // Notify Flutter
                    if (window.FlutterChannel) {
                        FlutterChannel.postMessage(JSON.stringify({
                            type: 'mistake',
                            character: currentCharacter
                        }));
                    }
                }
                });
                
                showStatus('Character loaded: ' + character);
            } catch (error) {
                console.error('Error creating HanziWriter:', error);
                showStatus('Error: ' + error.message);
                if (window.FlutterChannel) {
                    FlutterChannel.postMessage(JSON.stringify({
                        type: 'error',
                        message: 'Failed to create HanziWriter: ' + error.message
                    }));
                }
            }
        }

        // Animate the character
        function animateCharacter() {
            if (!checkHanziWriter()) {
                showStatus('HanziWriter not loaded yet');
                return;
            }
            if (writer) {
                try {
                    writer.animateCharacter({
                        onComplete: function() {
                            showStatus('Animation complete!');
                        }
                    });
                } catch (error) {
                    console.error('Error animating character:', error);
                    showStatus('Error: ' + error.message);
                }
            } else {
                showStatus('Please initialize a character first');
            }
        }

        // Start quiz mode
        function startQuiz() {
            if (!checkHanziWriter()) {
                showStatus('HanziWriter not loaded yet');
                return;
            }
            if (writer) {
                try {
                    writer.quiz({
                        onComplete: function() {
                            showStatus('Quiz complete!');
                            if (window.FlutterChannel) {
                                FlutterChannel.postMessage(JSON.stringify({
                                    type: 'quizComplete',
                                    character: currentCharacter
                                }));
                            }
                        }
                    });
                } catch (error) {
                    console.error('Error starting quiz:', error);
                    showStatus('Error: ' + error.message);
                }
            } else {
                showStatus('Please initialize a character first');
            }
        }

        // Reset the character
        function resetCharacter() {
            if (!checkHanziWriter()) {
                showStatus('HanziWriter not loaded yet');
                return;
            }
            if (writer) {
                try {
                    writer.hideCharacter();
                    showStatus('Character reset');
                } catch (error) {
                    console.error('Error resetting character:', error);
                    showStatus('Error: ' + error.message);
                }
            } else {
                showStatus('Please initialize a character first');
            }
        }

        // Show status message
        function showStatus(message) {
            const statusEl = document.getElementById('status-message');
            statusEl.textContent = message;
            statusEl.style.display = 'block';
            setTimeout(() => {
                statusEl.style.display = 'none';
            }, 2000);
        }

        // Listen for messages from Flutter
        window.addEventListener('flutter_inappwebview_platform_ready', function(event) {
            console.log('Flutter WebView ready');
        });
    </script>
</body>
</html>
